[build-system]
requires = ["hatchling==1.32.4"]  # pinned build backend: deterministic package metadata (API-0 C3)
build-backend = "hatchling.build"

[project]
name = "velith"
dynamic = ["version"]  # single source of truth: velith.__version__ (src/velith/__init__.py)
description = "Velith — a grounded, verification-first engineering-intelligence research harness (software vertical; M0–M9)."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Proprietary" }
authors = [{ name = "Velith" }]
dependencies = [
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    # Engineering API v0 (D33, API-0 C1): Noetica consumed as the pinned, published release
    # (D30 item 3). Tag v1.0.0 = commit 44d380bdcadf50fec463c2840bc5d181d7e7e0f7.
    "noetica @ git+https://github.com/manish0360-coder/Noetica-agent-lab@v1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pytest==8.3.3",
    "pre-commit==3.8.0",
]
# M9 analysis stack (handoff OED-3/OED-6): isolated optional group, installed only in
# the verifier image + CI. Only statsmodels is pinned here; its exact transitive matrix
# (numpy/scipy/pandas/patsy/formulaic/packaging + transitives) is locked in
# constraints/analysis-py312.txt, resolved inside python:3.12.7-slim-bookworm (OED-5).
analysis = [
    "statsmodels==0.15.0",
]
# G0 exact-geometry verifier (D34; Engineering API v0.2): the pinned OCCT 8.0.1 binding (spec E).
# Installed hash-pinned from constraints/geometry-py312.txt; only velith.geometry._kernel imports it.
geometry = [
    "cadquery-ocp-novtk==8.0.1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/velith"]

# Required for the git-tag pin of noetica above (a PEP 508 direct reference).
[tool.hatch.metadata]
allow-direct-references = true

# The version is read from the package, never from a git tag (API-0 C3).
[tool.hatch.version]
path = "src/velith/__init__.py"

# ----------------------------------------------------------------------------
# Ruff: single source of truth for lint AND format (M0 §7).
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["velith"]

# ----------------------------------------------------------------------------
# mypy: strict mode, zero errors required (M0 §7).
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true

# Scoped override (M9 handoff OED-6): statsmodels and scipy ship no type stubs. Confined
# to those two namespaces so `mypy --strict` stays global everywhere else; statsmodels is
# isolated behind the typed analysis/gee.py adapter (M9-C8) and scipy behind the typed
# analysis/wald.py adapter (M9-C10).
[[tool.mypy.overrides]]
module = ["statsmodels.*", "scipy.*"]
ignore_missing_imports = true

# Scoped override (G0): the OCCT binding ships no type stubs. Its only importer is the isolated
# worker velith/geometry/_kernel.py, which treats every kernel object as Any at that boundary.
[[tool.mypy.overrides]]
module = ["OCP.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ----------------------------------------------------------------------------
# pytest: tests discovered under tests/ (M0 §8).
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"
